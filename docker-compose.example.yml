# Primjer za lokalno pokretanje / probu. Kopiraj .env.example u .env i popuni (APP_KEY: php app/bin/gen-key.php).
# Za produkciju: TLS i ispravan CLIENT_IP_HEADER moraju biti iza reverse proxyja platforme.
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: cjenik
      DB_USER: cjenik
      DB_PASS: ${DB_PASS}
    volumes:
      - cjenik-web:/var/www/html
      - cjenik-storage:/var/www/storage
    depends_on:
      - db

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: cjenik
      MARIADB_USER: cjenik
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - cjenik-db:/var/lib/mysql

volumes:
  cjenik-web:
  cjenik-storage:
  cjenik-db:
